<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative Audio Browser</title>
  <meta name="description"
    content="An interactive generative audio-visual experience. Drop animated elements onto the canvas to create evolving soundscapes." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <button id="toolbar-toggle" type="button" aria-label="Open sidebar" aria-expanded="true" aria-controls="toolbar">
    <span class="toolbar-toggle-icon"></span>
  </button>
  <div id="toolbar-backdrop"></div>
  <aside id="toolbar">
    <div class="toolbar-header">
      <h2>Elements</h2>
      <button id="toolbar-close" type="button" aria-label="Collapse sidebar">&times;</button>
    </div>
    <div class="toolbar-items">
      <!-- Generators (Sound producers) -->
      <section class="toolbar-section">
        <h3 class="toolbar-category-title">Generators</h3>
        <div class="toolbar-category-items">
          <button class="toolbar-btn" data-element="orb" draggable="true" id="toolbar-orb">
            <span class="toolbar-preview orb-preview"></span>
            <span class="toolbar-label">Orb</span>
          </button>
          <button class="toolbar-btn" data-element="deeppad" draggable="true" id="toolbar-deeppad">
            <span class="toolbar-preview deeppad-preview"></span>
            <span class="toolbar-label">Deep Pad</span>
          </button>
          <button class="toolbar-btn" data-element="etheralwind" draggable="true" id="toolbar-etheralwind">
            <span class="toolbar-preview etheralwind-preview"></span>
            <span class="toolbar-label">Ethereal Wind</span>
          </button>
        </div>
      </section>

      <!-- Modulators (Sound transformers) -->
      <section class="toolbar-section">
        <h3 class="toolbar-category-title">Modulators</h3>
        <div class="toolbar-category-items">
          <button class="toolbar-btn" data-element="timewarp" draggable="true" id="toolbar-timewarp">
            <span class="toolbar-preview timewarp-preview"></span>
            <span class="toolbar-label">Time Warp</span>
          </button>
          <button class="toolbar-btn" data-element="woah" draggable="true" id="toolbar-woah">
            <span class="toolbar-preview woah-preview"></span>
            <span class="toolbar-label">Woah</span>
          </button>
          <button class="toolbar-btn" data-element="modulator" draggable="true" id="toolbar-modulator">
            <span class="toolbar-preview modulator-preview"></span>
            <span class="toolbar-label">Modulator</span>
          </button>
          <button class="toolbar-btn" data-element="orbit" draggable="true" id="toolbar-orbit">
            <span class="toolbar-preview orbit-preview"></span>
            <span class="toolbar-label">Orbit</span>
          </button>
        </div>
      </section>
    </div>
    <div class="toolbar-footer">
      <p>Drag or click to place</p>
    </div>
  </aside>
  <main id="canvas">
    <!-- SVG filter for bloom effect -->
    <svg id="bloom-svg" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
      <defs>
        <filter id="bloom-filter" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
          <feColorMatrix in="blur" type="saturate" values="2.5" result="saturated" />
          <feMerge>
            <feMergeNode in="saturated" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <canvas id="connections-canvas"></canvas>
    <div id="elements-container"></div>

    <div id="erase-zone" aria-hidden="true">
      <span id="erase-zone-icon">&times;</span>
    </div>

    <div id="start-overlay">
      <div id="start-overlay-content">
        <div id="start-icon">࿂</div>
        <h1>Generative Audio Browser</h1>
        <p>Create evolving soundscapes with animated visual elements</p>
        <button id="start-btn">▶ Start Experience</button>
      </div>
    </div>

    <dialog id="orb-edit-dialog">
      <form id="orb-edit-form" method="dialog">
        <div class="orb-edit-header">
          <h2>Edit Orb</h2>
          <button type="button" id="orb-edit-close" aria-label="Close">&times;</button>
        </div>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Waveform</span>
          <select id="orb-edit-waveform">
            <option value="sine">Sine</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
          </select>
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Attack <span class="orb-edit-value" id="orb-edit-attack-value"></span></span>
          <input type="range" id="orb-edit-attack" min="0.01" max="2" step="0.01" />
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Decay <span class="orb-edit-value" id="orb-edit-decay-value"></span></span>
          <input type="range" id="orb-edit-decay" min="0.01" max="2" step="0.01" />
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Sustain <span class="orb-edit-value" id="orb-edit-sustain-value"></span></span>
          <input type="range" id="orb-edit-sustain" min="0" max="1" step="0.01" />
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Release <span class="orb-edit-value" id="orb-edit-release-value"></span></span>
          <input type="range" id="orb-edit-release" min="0.01" max="4" step="0.01" />
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Note Length</span>
          <select id="orb-edit-note-duration">
            <option value="16n">1/16</option>
            <option value="8n">1/8</option>
            <option value="4n">1/4</option>
            <option value="2n">1/2</option>
            <option value="1n">1/1</option>
          </select>
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Note Interval <span class="orb-edit-value"
              id="orb-edit-note-interval-value"></span></span>
          <input type="range" id="orb-edit-note-interval" min="100" max="2000" step="50" />
        </label>

        <label class="orb-edit-field">
          <span class="orb-edit-label">Volume <span class="orb-edit-value" id="orb-edit-volume-value"></span></span>
          <input type="range" id="orb-edit-volume" min="0" max="1.2" step="0.01" />
        </label>
      </form>
    </dialog>

    <dialog id="pad-edit-dialog">
      <form id="pad-edit-form" method="dialog">
        <div class="pad-edit-header">
          <h2>Edit Deep Pad</h2>
          <button type="button" id="pad-edit-close" aria-label="Close">&times;</button>
        </div>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Waveform</span>
          <select id="pad-edit-waveform">
            <option value="sine">Sine</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="fatsawtooth">Fat Sawtooth</option>
          </select>
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Attack <span class="pad-edit-value" id="pad-edit-attack-value"></span></span>
          <input type="range" id="pad-edit-attack" min="0.05" max="4" step="0.05" />
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Decay <span class="pad-edit-value" id="pad-edit-decay-value"></span></span>
          <input type="range" id="pad-edit-decay" min="0.05" max="4" step="0.05" />
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Sustain <span class="pad-edit-value" id="pad-edit-sustain-value"></span></span>
          <input type="range" id="pad-edit-sustain" min="0" max="1" step="0.01" />
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Release <span class="pad-edit-value" id="pad-edit-release-value"></span></span>
          <input type="range" id="pad-edit-release" min="0.05" max="6" step="0.05" />
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Note Interval <span class="pad-edit-value"
              id="pad-edit-note-interval-value"></span></span>
          <input type="range" id="pad-edit-note-interval" min="1000" max="10000" step="250" />
        </label>

        <label class="pad-edit-field">
          <span class="pad-edit-label">Volume <span class="pad-edit-value" id="pad-edit-volume-value"></span></span>
          <input type="range" id="pad-edit-volume" min="0" max="1.2" step="0.01" />
        </label>
      </form>
    </dialog>

    <dialog id="wind-edit-dialog">
      <form id="wind-edit-form" method="dialog">
        <div class="wind-edit-header">
          <h2>Edit Ethereal Wind</h2>
          <button type="button" id="wind-edit-close" aria-label="Close">&times;</button>
        </div>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Noise Type</span>
          <select id="wind-edit-noise-type">
            <option value="white">White</option>
            <option value="pink">Pink</option>
            <option value="brown">Brown</option>
          </select>
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Sweep Rate <span class="wind-edit-value"
              id="wind-edit-sweep-rate-value"></span></span>
          <input type="range" id="wind-edit-sweep-rate" min="0.01" max="0.3" step="0.01" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Filter Frequency <span class="wind-edit-value"
              id="wind-edit-filter-freq-value"></span></span>
          <input type="range" id="wind-edit-filter-freq" min="80" max="600" step="10" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Filter Range <span class="wind-edit-value"
              id="wind-edit-filter-range-value"></span></span>
          <input type="range" id="wind-edit-filter-range" min="1" max="8" step="0.1" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Filter Depth <span class="wind-edit-value"
              id="wind-edit-filter-depth-value"></span></span>
          <input type="range" id="wind-edit-filter-depth" min="0" max="1" step="0.01" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Pan Rate <span class="wind-edit-value"
              id="wind-edit-pan-rate-value"></span></span>
          <input type="range" id="wind-edit-pan-rate" min="0.01" max="0.5" step="0.01" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Pan Depth <span class="wind-edit-value"
              id="wind-edit-pan-depth-value"></span></span>
          <input type="range" id="wind-edit-pan-depth" min="0" max="1" step="0.01" />
        </label>

        <label class="wind-edit-field">
          <span class="wind-edit-label">Volume <span class="wind-edit-value" id="wind-edit-volume-value"></span></span>
          <input type="range" id="wind-edit-volume" min="0" max="1.2" step="0.01" />
        </label>
      </form>
    </dialog>
  </main>

  <script type="module" src="src/app.ts"></script>
</body>

</html>
